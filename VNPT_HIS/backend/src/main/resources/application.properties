spring.application.name=vnpt-his-backend
server.port=8089

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/vnpt_his
spring.datasource.username=postgres
spring.datasource.password=Luan1302@
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SMIG Gateway integration
smig.gateway.url=http://127.0.0.1:8000
# Khoa API do Gateway cap cho co so nay (python -m backend.auth issue ...).
# Gateway tra khoa ra ma co so, nen smig.facility.code ben duoi phai TRUNG voi
# co so cua khoa. Bo trong thi chi chay duoc khi Gateway chua bat buoc khoa.
# Trien khai that: dat qua bien moi truong SMIG_GATEWAY_API_KEY, khong ghi vao
# tep nay.
smig.gateway.api-key=${SMIG_GATEWAY_API_KEY:}

# Co so kham chua benh cua ban HIS nay. Duoc gui kem moi yeu cau sinh Condition,
# nen mot ban Gateway phuc vu duoc ca hai benh vien ma ho so khong lan vao nhau
# (Gateway phai bat SMIG_ALLOW_CLIENT_FACILITY=1). Ma nay PHAI khac ma cua HIS
# Python (BV-DEMO-01), neu khong hai noi bi coi la cung mot co so.
smig.facility.code=79002
smig.facility.name=Benh vien VNPT

# May chu EMR Cloud (HAPI FHIR). HIS chi DOC tu day de tra cuu benh nhan;
# moi duong GHI len truc van di qua SMIG Gateway o tren.
smig.fhir.url=http://127.0.0.1:8090/fhir
